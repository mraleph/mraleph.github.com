<article class="mb-2">
  <h2 class="text-l font-bold">
    <a href="{{ include.post.url }}" class="hover:text-lk">{{ include.post.title }}</a>
  </h2>
  <p class="leading-relaxed">
    {{include.post.excerpt}}
    <span class="text-gray-400 ml-1 text-sm whitespace-pre">{{include.post.date | date:'%b %Y'}}</span>
  </p>
</article>
