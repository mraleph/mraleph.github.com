<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">

  <link href="/atom.xml" rel="alternate" title="atom feed" type="application/atom+xml">

  {% for font in page.webfonts %}
    <link href='http://fonts.googleapis.com/css?family={{ font }}' rel='stylesheet' type='text/css'>
  {% endfor %}

  {% for stylesheet in page.stylesheets %}
    <link href='{{ stylesheet }}' rel='stylesheet' type='text/css'>
  {% endfor %}

  <!-- <link rel="stylesheet" href="/css/blog.css" type="text/css"> -->
  <link rel="stylesheet" href="/assets/css/main.css" type="text/css">
  <link rel="stylesheet" href="/css/pygments.css" type="text/css">
  <link rel="stylesheet" href="/assets/css/fonts/mbtype/equity-light.css" type="text/css">
  <link rel="stylesheet" href="/assets/css/fonts/mbtype/concourse-index.css" type="text/css">

  <title> {{ page.title }} </title>
</head>
<body class="bg-tw text-tb pt-6 w-full blogpost">
  <div class="flex lg:justify-center max-lg:px-6 w-full max-w-full">
    <div class="w-full lg:max-w-[800px] md:text-xl relative">
      <div class="title">
        <div class="border-t-3">
          <div class="mb-2"> {{ page.title }} </div>
          <time class="text-lg lowercase text-tbg" datetime="{{ page.date }}">{{ page.date | date:'%d %b %Y' | downcase }}</time>

        </div>
      </div>
      {{ content }}

      <p class="comments">
        <span>Comments?</span>

        Drop me a mail <code>me@mrale.ph</code> or find me on
        <a href="https://mastodon.social/@mraleph">Mastodon</a>,
        <a href="https://x.com/mraleph">X</a> or <a href="https://bsky.app/profile/mrale.ph">Bluesky</a>.
      </p>
    </div>
  </div>
</body>
</html>
